<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Vinyl subtle radial depth -->
    <radialGradient id="vGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="65%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </radialGradient>
  </defs>

  <!-- Yellow Vinyl Disc Body -->
  <circle cx="16" cy="16" r="15.5" fill="url(#vGrad)" />

  <!-- Concentric Sound Grooves -->
  <circle cx="16" cy="16" r="14.2" fill="none" stroke="#000000" stroke-width="0.5" opacity="0.18" />
  <circle cx="16" cy="16" r="12.8" fill="none" stroke="#000000" stroke-width="0.5" opacity="0.15" />
  <circle cx="16" cy="16" r="11.4" fill="none" stroke="#000000" stroke-width="0.5" opacity="0.18" />
  <circle cx="16" cy="16" r="10" fill="none" stroke="#000000" stroke-width="0.5" opacity="0.15" />

  <!-- Vinyl Glossy Butterfly Sheen Highlights -->
  <path d="M16 16 L27 5 A15.5 15.5 0 0 1 29 11 Z" fill="#FFFFFF" opacity="0.25" />
  <path d="M16 16 L5 27 A15.5 15.5 0 0 1 3 21 Z" fill="#FFFFFF" opacity="0.25" />
  <path d="M16 16 L5 5 A15.5 15.5 0 0 1 11 3 Z" fill="#FFFFFF" opacity="0.15" />
  <path d="M16 16 L27 27 A15.5 15.5 0 0 1 21 29 Z" fill="#FFFFFF" opacity="0.15" />

  <!-- Center Label Area -->
  <circle cx="16" cy="16" r="8.2" fill="#FBBF24" stroke="#D97706" stroke-width="0.6" />

  <!-- Bold HQ Monogram -->
  <text
    x="16"
    y="19.5"
    text-anchor="middle"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-weight="900"
    font-size="10"
    fill="#09090B"
    letter-spacing="-0.5"
  >HQ</text>
</svg>
